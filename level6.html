<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 6 – Code‑Knacker</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: url("Meer.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 40px;
      border-radius: 16px;
      max-width: 700px;
      text-align: center;
    }

    input {
      margin-top: 20px;
      padding: 10px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      width: 250px;
      text-align: center;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background-color: #4da6ff;
      color: white;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Level 6 - Code‑Knacker</h1>

    <p>
      Um weiterzukommen, musst du den geheimen Code lösen.<br><br>
      <b>Hinweis:</b><br>
      Welle = 3<br>
      Muschel = 5<br>
      Boot = 2<br><br>
      <b>Frage:</b><br>
      Was ergibt <b>Welle + Boot</b>?
    </p>

    <input id="code" placeholder="Code eingeben">
    <button onclick="check()">Prüfen</button>

    <div id="wrong">Falscher Code!</div>
  </div>

  <script>
    function check() {
      const value = document.getElementById("code").value.trim();

      if (value === "5") { // 3 + 2 = 5
        window.location.href = "level7.html";
      } else {
        document.getElementById("wrong").style.display = "block";
        setTimeout(() => {
          document.getElementById("wrong").style.display = "none";
        }, 1200);
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 5 – Meer‑Quiz</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: url("Meer.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 40px;
      border-radius: 16px;
      max-width: 700px;
      text-align: center;
    }

    .question {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .answers button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background-color: #4da6ff;
      color: white;
      transition: background-color 0.3s;
    }

    .answers button:hover {
      background-color: #66b3ff;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Level 5 – Griechenland‑Quiz</h1>
    <div id="quiz"></div>
    <div id="wrong">Falsch! Versuch es nochmal.</div>
  </div>

  <script>
    const quizData = [
      {
        question: "Welche Insel hat die längste Küstenlinie in Griechenland?",
        answers: ["Kreta", "Rhodos", "Lesbos", "Euböa"],
        correct: 0
      },
      {
        question: "Welches Meer liegt westlich von Griechenland?",
        answers: ["Libysches Meer", "Ägäisches Meer", "Ionisches Meer", "Marmarameer"],
        correct: 2
      },
      {
        question: "Welche Stadt gilt als die älteste dauerhaft bewohnte Stadt Griechenlands?",
        answers: ["Argos", "Athen", "Korinth", "Sparta"],
        correct: 0
      },
      {
        question: "Welche Farben hat die griechische Flagge?",
        answers: ["Grün und Gelb", "Schwarz und Blau", "Rot und Weiß", "Blau und Weiß"],
        correct: 3
      },
      {
        question: "Welcher griechische Vulkan ist noch aktiv?",
        answers: ["Olympus", "Methana", "Taygetos", "Athos"],
        correct: 1
      },
      {
        question: "Wer gilt in der griechischen Mythologie als Gott des Meeres?",
        answers: ["Zeus", "Hermes", "Ares", "Poseidon"],
        correct: 3
      },
      {
        question: "Welche antike griechische Stadt war berühmt für ihre Bibliothek und Wissenschaftler?",
        answers: ["Alexandria", "Delphi", "Olympia", "Mykene"],
        correct: 0
      },
      {
        question: "Welches dieser Öle wird traditionell am häufigsten in der griechischen Küche verwendet?",
        answers: ["Sonnenblumenöl", "Sesamöl", "Olivenöl", "Rapsöl"],
        correct: 2
      },
      {
        question: "WWelche Säulenordnung stammt aus Griechenland und ist die älteste bekannte Form?",
        answers: ["Ionisch", "Dorisch", "Korinthisch", "Komposit"],
        correct: 1
      }
    ];

    let current = 0;

    function loadQuestion() {
      const q = quizData[current];
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = `
        <div class="question">${q.question}</div>
        <div class="answers">
          ${q.answers.map((a, i) => `<button onclick="checkAnswer(${i})">${a}</button>`).join("")}
        </div>
      `;
    }

    function checkAnswer(i) {
      if (i === quizData[current].correct) {
        current++;
        document.getElementById("wrong").style.display = "none";

        if (current >= quizData.length) {
          window.location.href = "level6.html";
        } else {
          loadQuestion();
        }
      } else {
        document.getElementById("wrong").style.display = "block";
      }
    }

    loadQuestion();
  </script>

</body>
</html>

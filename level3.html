<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 3 – Memory</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: url("Meer.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 40px;
      border-radius: 16px;
      max-width: 700px;
      text-align: center;
    }

    #memory {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      width: 100px;
      height: 100px;
      background-color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      color: #333;
      user-select: none;
    }

    .hidden {
      background-color: #4da6ff;
      color: transparent;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Level 3 – Memory</h1>
    <p>Finde alle Paare, um weiterzukommen!</p>

    <div id="memory"></div>

    <div id="wrong">Nicht das richtige Paar!</div>
  </div>

  <script>
    // Symbole für Memory
    const symbols = ["🌊", "🐚", "⭐", "⛵"];
    let cards = [...symbols, ...symbols]; // 4 Paare

    // Mischen
    cards.sort(() => Math.random() - 0.5);

    const memory = document.getElementById("memory");

    // Karten erzeugen
    cards.forEach((symbol, index) => {
      const div = document.createElement("div");
      div.classList.add("card", "hidden");
      div.dataset.symbol = symbol;
      div.dataset.index = index;
      div.innerText = symbol;
      memory.appendChild(div);
    });

    let first = null;
    let second = null;
    let lock = false;
    let found = 0;

    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        if (lock || !card.classList.contains("hidden")) return;

        card.classList.remove("hidden");

        if (!first) {
          first = card;
        } else {
          second = card;
          lock = true;

          if (first.dataset.symbol === second.dataset.symbol) {
            // Paar gefunden
            found++;
            first = null;
            second = null;
            lock = false;

            if (found === symbols.length) {
              window.location.href = "level4.html";
            }
          } else {
            // Falsches Paar
            document.getElementById("wrong").style.display = "block";

            setTimeout(() => {
              first.classList.add("hidden");
              second.classList.add("hidden");
              first = null;
              second = null;
              lock = false;
              document.getElementById("wrong").style.display = "none";
            }, 800);
          }
        }
      });
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 7 – Die Spur im Sand</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: url("Meer.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 40px;
      border-radius: 16px;
      max-width: 700px;
      text-align: center;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background-color: #4da6ff;
      color: white;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Level 7 – Die Spur im Sand</h1>

    <p id="story">
      Du gehst am Strand entlang.  
      Der Wind ist mild, die Wellen ruhig.  
      Plötzlich bemerkst du eine einzelne, runde Spur im Sand.  
      Sie wirkt ungewöhnlich – nicht wie eine normale Tierpfote.
      <br><br>
      Was willst du tun?
    </p>

    <button onclick="choose('follow')">Der Spur folgen</button>
    <button onclick="choose('inspect')">Spur untersuchen</button>
    <button onclick="choose('wipe')">Spur wegwischen</button>
  </div>

  <script>
    function choose(option) {
      const story = document.getElementById("story");

      // -------------------------
      // HAUPTWEG 1: SPUR FOLGEN
      // -------------------------
      if (option === "follow") {
        story.innerHTML = `
          Du folgst der Spur ein Stück den Strand entlang.<br>
          Nach einigen Metern teilt sie sich plötzlich in zwei Richtungen:<br><br>
          Eine Spur wirkt frisch und klar.<br>
          Die andere ist älter und teilweise vom Wind verweht.<br><br>
          Welche wählst du?<br><br>
          <button onclick="choose('fresh')">Frische Spur</button>
          <button onclick="choose('old')">Alte Spur</button>
        `;
      }

      // Outcome B – Frische Spur → führt zu Outcome A
      if (option === "fresh") {
        story.innerHTML = `
          Du folgst der frischen Spur weiter.<br>
          Zwischen zwei kleinen Steinen siehst du eine winzige Sandkrabbe.<br>
          Sie hebt kurz eine Schere und verschwindet dann unter einem Stein.<br><br>
          Neben dem Stein liegt ein kleines eingeritztes Symbol.<br><br>
          <b>Du hast das Tier gefunden.</b><br><br>
          Weiter geht es...
        `;
        setTimeout(() => window.location.href = "level8.html", 3000);
      }

      // Outcome B – Alte Spur → Soft-Fail
      if (option === "old") {
        story.innerHTML = `
          Du folgst der alten Spur.<br>
          Doch nach wenigen Metern verliert sie sich im Sand.<br><br>
          Du kannst nicht mehr herausfinden, welches Tier sie hinterlassen hat.<br><br>
          <i>Versuch es nochmal.</i>
        `;
      }

      // -------------------------
      // HAUPTWEG 2: SPUR UNTERSUCHEN
      // -------------------------
      if (option === "inspect") {
        story.innerHTML = `
          Du untersuchst die Spur genauer.<br>
          Der Sand bricht leicht ein – darunter liegt ein kleiner Achat.<br>
          Glatt, rund, wunderschön gemustert.<br><br>
          Willst du der Spur doch folgen?<br><br>
          <button onclick="choose('followFromC')">Ja, der Spur folgen</button>
          <button onclick="choose('noFollow')">Nein</button>
        `;
      }

      // Outcome C – Spur folgen → Outcome A
      if (option === "followFromC") {
        story.innerHTML = `
          Du folgst der Spur weiter.<br>
          Zwischen zwei kleinen Steinen siehst du eine winzige Sandkrabbe.<br>
          Sie hebt kurz eine Schere und verschwindet dann unter einem Stein.<br><br>
          Neben dem Stein liegt ein kleines eingeritztes Symbol.<br><br>
          <b>Du hast das Tier gefunden.</b><br><br>
          Weiter geht es...
        `;
        setTimeout(() => window.location.href = "level8.html", 3000);
      }

      // Outcome C – Nicht folgen → Soft-Fail
      if (option === "noFollow") {
        story.innerHTML = `
          Du nimmst den Achat an dich, aber folgst der Spur nicht.<br><br>
          Du wirst nie erfahren, welches Tier sie hinterlassen hat.<br><br>
          <i>Versuch es nochmal.</i>
        `;
      }

      // -------------------------
      // HAUPTWEG 3: SPUR WEGWISCHEN
      // -------------------------
      if (option === "wipe") {
        story.innerHTML = `
          Du wischst die Spur weg.<br>
          Eine Windböe kommt vom Meer und verweht den Sand weiter.<br><br>
          Die Spur ist endgültig verschwunden.<br><br>
          <i>Versuch es nochmal.</i>
        `;
      }
    }
  </script>

</body>
</html>

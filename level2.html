<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 2 – Wimmelbild</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      position: relative;
      width: 90vw;
      max-width: 900px;
    }

    img {
      width: 100%;
      border-radius: 12px;

      /* <<< WICHTIG: Bild passt jetzt in den Bildschirm */
      max-height: 100vh;
      object-fit: contain;
    }

    .target {
      position: absolute;
      width: 30px;
      height: 30px;
      cursor: pointer;

      /*DEBUG: sichtbar machen
      background: rgba(255,0,0,0.3);
      */

      left: 71%;
      top: 45%;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      font-size: 22px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="Level2.png" alt="Wimmelbild">

    <div class="target" onclick="correct()"></div>
  </div>

  <div id="wrong">Das war nicht die Lösung!</div>

  <script>
    function correct() {
      window.location.href = "level3.html";
    }

    document.body.addEventListener("click", function(e) {
      if (!e.target.classList.contains("target")) {
        const wrong = document.getElementById("wrong");
        wrong.style.display = "block";
        setTimeout(() => wrong.style.display = "none", 1200);
      }
    });
  </script>

</body>
</html>

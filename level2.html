<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 2 – Wimmelbild</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: #000;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;

      height: 100vh;
      overflow: hidden;
    }

    #riddle {
      font-size: 20px;
      text-align: center;
      max-width: 700px;
      margin: 10px 0 15px 0;
      line-height: 1.4;

      /* <<< WICHTIG: Text blockiert keine Klicks mehr */
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 90vw;
      max-width: 900px;
      flex-shrink: 0;
    }

    img {
      width: 100%;
      border-radius: 12px;
      max-height: 100vh;
      object-fit: contain;
      pointer-events: none; /* Bild blockiert ebenfalls keine Klicks */
    }

    .target {
      position: absolute;
      width: 60px;
      height: 60px;
      cursor: pointer;

      left: 62%;
      top: 58%;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      font-size: 22px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="riddle">
    <b>Ich bin</b> klein, aber ich entdecke alles zuerst.<br>
    <b>Ich habe</b> die Aufgabe, jede Bewegung in dieser Gasse zu prüfen.<br>
    <b>Ich kann</b> die Abendluft so fein wahrnehmen, dass mir kein Duft entgeht.<br>
    <b>Finde mich</b>, um weiter ins nächste Level zu spazieren.
  </div>

  <div class="container">
    <img src="Level2.png" alt="Wimmelbild">
    <div class="target" onclick="correct()"></div>
  </div>

  <div id="wrong">Das war nicht die Lösung!</div>

  <script>
    function correct() {
      window.location.href = "level3.html";
    }

    document.body.addEventListener("click", function(e) {
      if (!e.target.classList.contains("target")) {
        const wrong = document.getElementById("wrong");
        wrong.style.display = "block";
        setTimeout(() => wrong.style.display = "none", 1200);
      }
    });
  </script>

</body>
</html>

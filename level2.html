<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 2 – Wimmelbild</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      padding-top: 20px;
    }

    .container {
      position: relative;
      width: 90vw;
      max-width: 900px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      pointer-events: none; /* <<< WICHTIG: Bild blockiert keine Klicks mehr */
    }

    .target {
      position: absolute;
      width: 45px;
      height: 45px;
      cursor: pointer;

      /* DEBUG: sichtbar machen
      background: rgba(255,0,0,0.3);
      */

      left: 70%;
      top: 63%;
    }

    #wrong {
      display: none;
      color: #ffb3b3;
      font-size: 22px;
      text-align: center;
      margin-top: 20px;
    }

    #riddle {
      font-size: 20px;
      text-align: center;
      max-width: 700px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="riddle">
    <b>Ich bin</b> klein, aber ich entdecke alles zuerst.<br>
    <b>Ich habe</b> die Aufgabe, jede Bewegung in dieser Gasse zu prüfen.<br>
    <b>Ich kann</b> die Abendluft so fein wahrnehmen, dass mir kein Duft entgeht.<br>
    <b>Finde mich</b>, um weiter ins nächste Level zu spazieren.
  </div>

  <div class="container">
    <img src="Level2.png" alt="Wimmelbild">

    <div class="target" onclick="correct()"></div>
  </div>

  <div id="wrong">Das war nicht die richtige Stelle!</div>

  <script>
    function correct() {
      window.location.href = "level3.html";
    }

    document.querySelector(".container").addEventListener("click", function(e) {
      if (!e.target.closest(".target")) {
        const wrong = document.getElementById("wrong");
        wrong.style.display = "block";
        setTimeout(() => wrong.style.display = "none", 1200);
      }
    });
  </script>

</body>
</html>
